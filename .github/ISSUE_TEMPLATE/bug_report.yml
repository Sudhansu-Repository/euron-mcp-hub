name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security issues: do not file here**, follow SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: If a call is involved, include the tool name, the arguments (with private content removed), the outcome shown in the audit log and the request id from the error.
      placeholder: |
        1. make up && make demo
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Catalog, discovery and health
        - The gateway and policy
        - Secrets and encryption
        - Clients, keys and permissions
        - Audit log and usage
        - Accounts and sign-in
        - Web app
        - API
        - Deployment
        - Other
  - type: dropdown
    id: transport
    attributes:
      label: Upstream transport
      options: [Streamable HTTP, stdio, Not specific to one]
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options: [Local (Floci), Local against AWS, AWS (Terraform), Self-hosted (other), Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact keys, tokens, passwords and hostnames before pasting.
      render: text
