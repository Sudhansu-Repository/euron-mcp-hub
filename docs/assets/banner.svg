<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Euron MCPHub</title>
  <desc id="d">A registry and gateway for MCP servers: one endpoint for every tool, per-client permissions, encrypted secrets and an audit log.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0f2e"/>
      <stop offset="1" stop-color="#1e1b6b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="20" fill="url(#glow)"/>
  <g transform="translate(64 64)">
    <rect width="72" height="72" rx="18" fill="#4f46e5"/>
    <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.85">
      <path d="M36 36 18 18M36 36l18-18M36 36 18 54M36 36l18 18"/>
    </g>
    <g fill="#ffffff">
      <circle cx="18" cy="18" r="5"/><circle cx="54" cy="18" r="5"/>
      <circle cx="18" cy="54" r="5"/><circle cx="54" cy="54" r="5"/>
      <circle cx="36" cy="36" r="9"/>
    </g>
  </g>
  <text x="160" y="116" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff">Euron MCPHub</text>
  <text x="64" y="196" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#c7d2fe">One front door for every MCP server.</text>
  <text x="64" y="236" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#a5b4fc">Catalog and health, per-client tool permissions, encrypted secrets, an audit log of every call.</text>
  <g font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" transform="translate(860 70)">
    <rect width="356" height="46" rx="10" fill="#ffffff" fill-opacity="0.08"/>
    <text x="18" y="29" fill="#e0e7ff">tickets.list_tickets</text>
    <text x="270" y="29" fill="#6ee7b7">allowed</text>
    <rect y="58" width="356" height="46" rx="10" fill="#ffffff" fill-opacity="0.08"/>
    <text x="18" y="87" fill="#e0e7ff">notes.search_notes</text>
    <text x="270" y="87" fill="#6ee7b7">allowed</text>
    <rect y="116" width="356" height="46" rx="10" fill="#ffffff" fill-opacity="0.08"/>
    <text x="18" y="145" fill="#e0e7ff">tickets.delete_ticket</text>
    <text x="270" y="145" fill="#fda4af">denied</text>
    <rect y="174" width="356" height="46" rx="10" fill="#ffffff" fill-opacity="0.08"/>
    <text x="18" y="203" fill="#e0e7ff">weather.forecast</text>
    <text x="244" y="203" fill="#fcd34d">rate limited</text>
