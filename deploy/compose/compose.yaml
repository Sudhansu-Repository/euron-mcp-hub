# Euron MCPHub: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways.
#
# Host ports (override in .env if they clash with something you already run):
#   web 3150   api and gateway 8150   postgres 5455   valkey 6415   floci 4615
#   demo MCP servers 9150 (notes), 9151 (toolbox), 9152 (tickets)
name: mcphub

x-app-env: &app-env
  # Development mode: the local stack talks to an emulator and links to localhost, both of
  # which production refuses on purpose (Settings.production_problems).
  APP_ENV: development
  TZ: UTC
  LOG_LEVEL: ${MCPHUB_LOG_LEVEL:-info}
  LOG_FORMAT: json
  PRODUCT_NAME: ${MCPHUB_PRODUCT_NAME:-Euron MCPHub}
  DATABASE_URL: postgresql+asyncpg://mcphub:mcphub@postgres:5432/mcphub
  REDIS_URL: redis://valkey:6379/0
  SESSION_SECRET: ${MCPHUB_SESSION_SECRET:?run `make env` first}
  API_KEY_PEPPER: ${MCPHUB_API_KEY_PEPPER:?run `make env` first}
  CORS_ORIGINS: http://localhost:${MCPHUB_WEB_PORT:-3150},http://127.0.0.1:${MCPHUB_WEB_PORT:-3150}
  WEB_URL: http://localhost:${MCPHUB_WEB_PORT:-3150}
  API_URL: http://localhost:${MCPHUB_API_PORT:-8150}
  # Egress policy: private hosts are refused unless listed. The demo servers are listed so
  # the stack works offline; add your own with MCPHUB_UPSTREAM_ALLOWED_HOSTS.
  UPSTREAM_ALLOWED_HOSTS: demo-servers,${MCPHUB_UPSTREAM_ALLOWED_HOSTS:-}
  # The weather demo server runs over stdio, launched by the gateway itself.
  STDIO_ALLOWED_COMMANDS: mcphub-demo
  # Used by `mcphub demo seed` (make demo).
  DEMO_PASSWORD: ${MCPHUB_DEMO_PASSWORD:-}
  DEMO_SERVERS_HOST: demo-servers
  DEMO_TICKETS_TOKEN: ${MCPHUB_DEMO_TICKETS_TOKEN:-demo-tickets-token}
  DEMO_WEATHER_KEY: ${MCPHUB_DEMO_WEATHER_KEY:-demo-weather-key}

x-api-image: &api-image
  build:
    context: ../..
    dockerfile: infra/docker/api.Dockerfile
  image: mcphub-api:local

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: mcphub
      POSTGRES_USER: mcphub
      POSTGRES_PASSWORD: mcphub
    ports:
      - "127.0.0.1:${MCPHUB_PG_PORT:-5455}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcphub -d mcphub"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Key and view caches, rate limits, signed-out sessions and the worker lease. No eviction
  # policy: a revoked session must never be forgotten early.
  valkey:
    image: valkey/valkey:8.1.10-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${MCPHUB_REDIS_PORT:-6415}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # The management API and the MCP gateway (/mcp) in one process. It applies the migrations
  # on boot under an advisory lock.
  api:
    <<: *api-image
    environment:
      <<: *app-env
      MIGRATE_ON_BOOT: "true"
    ports:
      - "127.0.0.1:${MCPHUB_API_PORT:-8150}:8080"
    tmpfs:
      - /tmp:uid=10001,gid=10001
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  # Health checks, scheduled discovery and audit retention. One worker leads through a
  # lease in Valkey; any others wait as standbys.
  worker:
    <<: *api-image
    command: ["python", "-m", "mcphub.worker"]
    environment:
      <<: *app-env
      WORKER_METRICS_PORT: "9100"
    tmpfs:
      - /tmp:uid=10001,gid=10001
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3
    depends_on:
      # The API applies the migrations on boot; the worker starts once they are in.
      api:
        condition: service_healthy
    restart: unless-stopped

  # Small MCP servers (notes, toolbox, tickets) so the stack works offline: the tickets
  # server wants a bearer token, like a hosted one. The weather server runs over stdio
  # inside the api container instead.
  demo-servers:
    <<: *api-image
    command: ["mcphub-demo", "serve", "--host", "0.0.0.0"]
    environment:
      DEMO_TICKETS_TOKEN: ${MCPHUB_DEMO_TICKETS_TOKEN:-demo-tickets-token}
    ports:
      - "127.0.0.1:9150:9150"
      - "127.0.0.1:9151:9151"
      - "127.0.0.1:9152:9152"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; [socket.create_connection(('127.0.0.1', p), timeout=2).close() for p in (9150, 9151, 9152)]",
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    image: mcphub-web:local
    environment:
      # The browser calls the API directly, so this is the host-facing address.
      API_URL: http://localhost:${MCPHUB_API_PORT:-8150}
      PRODUCT_NAME: ${MCPHUB_PRODUCT_NAME:-Euron MCPHub}
    ports:
      - "127.0.0.1:${MCPHUB_WEB_PORT:-3150}:8080"
    restart: unless-stopped

volumes:
  pgdata:
