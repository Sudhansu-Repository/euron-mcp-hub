# Overlay: emulated AWS with Floci (https://github.com/floci-io/floci, MIT).
#
# The SAME Terraform that provisions real AWS (infra/terraform/modules) runs here against
# the emulator: the `terraform` one-shot applies infra/terraform/envs/local-floci (a KMS
# key and a Secrets Manager secret) before the API and the worker start. They then use KMS
# exactly as they do on AWS:
#
#   upstream secrets   envelope-encrypted by KMS key alias/mcphub-local, with an encryption
#                      context naming the server and the secret
x-floci-env: &floci-env
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT_URL: http://floci:4566
  SECRETS_BACKEND: kms
  SECRETS_KMS_KEY_ID: alias/mcphub-local

services:
  floci:
    image: floci/floci:2.3.0
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /data
    ports:
      - "127.0.0.1:${MCPHUB_FLOCI_PORT:-4615}:4566"
    volumes:
      - flocidata:/data

  # One-shot: provision the emulator with the production modules.
  terraform:
    image: hashicorp/terraform:1.16.6
    working_dir: /infra/envs/local-floci
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "waiting for floci..."
        until wget -q -O /dev/null http://floci:4566/; do sleep 1; done
        mkdir -p /tfdata/state
        terraform init -input=false -no-color >/dev/null
        # State lives in the tfdata volume, so it shares the emulator's lifecycle
        # (make down wipes both together).
        terraform apply -input=false -auto-approve -no-color -state=/tfdata/state/local.tfstate -var endpoint=http://floci:4566
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "1"
      TF_DATA_DIR: /tfdata
    volumes:
      - ../../infra/terraform:/infra
      - tfdata:/tfdata
    depends_on:
      - floci
    restart: "no"

  api:
    environment:
      <<: *floci-env
    depends_on:
      terraform:
        condition: service_completed_successfully

  worker:
    environment:
      <<: *floci-env
    depends_on:
      terraform:
        condition: service_completed_successfully

volumes:
  flocidata:
  tfdata:
